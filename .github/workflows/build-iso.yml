name: Build Nostalgia OS 2.0 Desktop ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3-pil

      - name: Run Build Script
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: Upload Bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: NostalgiaOS-2.0-x86_64
          path: NostalgiaOS-2.0-x86_64.iso
          retention-days: 7
