name: Build Nostalgia OS Bootable ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3-pil

      - name: Run ISO Pipeline Script
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: Upload Bootable ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NostalgiaOS-1.0-x86_64
          path: NostalgiaOS-1.0-x86_64.iso
          retention-days: 7
